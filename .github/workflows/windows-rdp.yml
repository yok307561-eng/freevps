name: Windows Cloud RDP + Tailscale Exit Node

permissions:
  actions: write
  contents: read
  
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue

      - name: 3. Install & Connect Tailscale Exit Node
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"

          Start-Process msiexec.exe -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          Start-Sleep -Seconds 5

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          & $Tailscale up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-exit-node" `
            --advertise-exit-node

          Start-Sleep -Seconds 10

          $ip = & $Tailscale ip -4

          Write-Host ""
          Write-Host "======================================"
          Write-Host " RDP SERVER READY"
          Write-Host " EXIT NODE READY"
          Write-Host "======================================"
          Write-Host "Tailscale IP: $ip"
          Write-Host "Username: NvDAdmin"
          Write-Host "Password: P@ssw0rd1qazXSW@#"
          Write-Host "======================================"

      - name: 4. Keep Server Alive
        run: |
          while ($true) {
            Write-Host "Server running..."
            Start-Sleep -Seconds 60
          }
